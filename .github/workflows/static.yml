name: Static analysis

on:
    push:
        branches:
            - master
            - '*.x'
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    phpstan:
        name: PHPStan - PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}${{ matrix.lowest && ' lowest' || '' }}

        runs-on: ubuntu-latest

        timeout-minutes: 15

        strategy:
            fail-fast: false
            matrix:
                include:
                    # The lowest and the highest supported stack analyse different Laravel and PHPStan versions.
                    -   { php: '8.3', laravel: '^12.18', testbench: '^10.0', lowest: true }
                    -   { php: '8.5', laravel: '13.*', testbench: '^11.0' }

        env:
            # The lowest allowed versions have security advisories; the audit job reports them.
            COMPOSER_NO_BLOCKING: 1

        steps:
            -   name: Checkout code
                uses: actions/checkout@v7

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    coverage: none

            -   name: Install dependencies
                run: |
                    composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
                    composer update --prefer-dist --no-interaction ${{ matrix.lowest && '--prefer-lowest' || '--prefer-stable' }}

            -   name: Run PHPStan
                run: vendor/bin/phpstan analyse --memory-limit=2G --error-format=github

    pint:
        name: Pint

        runs-on: ubuntu-latest

        timeout-minutes: 10

        steps:
            -   name: Checkout code
                uses: actions/checkout@v7

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    coverage: none

            -   name: Install dependencies
                run: composer update --prefer-dist --no-interaction

            -   name: Check the code style
                run: vendor/bin/pint --test

    audit:
        name: Composer audit

        runs-on: ubuntu-latest

        timeout-minutes: 10

        steps:
            -   name: Checkout code
                uses: actions/checkout@v7

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    coverage: none

            -   name: Validate composer.json
                run: composer validate --strict

            # Resolves the newest allowed versions, which is what a fresh install of the package gets.
            -   name: Install dependencies
                run: composer update --prefer-dist --no-interaction --no-audit

            -   name: Audit the dependencies
                run: composer audit --abandoned=report
